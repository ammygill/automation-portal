---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform/ee-minimal-rhel9:2.18

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.12

  system:
    - gcc

  python:
    - BOTO3

  galaxy:
    collections:
      - name: https://${AAP_EE_BUILDER_GITHUB_GITHUB_PUBLIC_OPENTRAINING_LABS_CUSTOMIZATIONS_TOKEN}@github.com/opentraining-labs-customizations/ansible-collection-mta-dev-lightspeed
        type: git

additional_build_steps:
  prepend_galaxy:
    - ARG ANSIBLE_GALAXY_SERVER_PRIVATE_HUB_RH_CERTIFIED_TOKEN
    - ARG ANSIBLE_GALAXY_SERVER_PRIVATE_HUB_VALIDATED_TOKEN
    - ARG ANSIBLE_GALAXY_SERVER_PRIVATE_HUB_PUBLISHED_TOKEN

options:
  package_manager_path: /usr/bin/microdnf
